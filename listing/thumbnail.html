  p { position: absolute; top: 960px; left: 0; right: 0; margin: 0; text-align: center; font-size: 52px; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: #ffd23f; color: #12332a; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; }
